# Public status page: checks the Pi from GitHub (so it works while the Pi is down) and publishes status.json
# to the status-data branch; docs/index.html (GitHub Pages) reads it. See README.
name: status
# GitHub throttles scheduled runs hard (a "*/5" cron ran about once every 3 hours), so a run does not check
# once: it checks every 2 minutes for ~50 minutes, then starts the next run itself (workflow_dispatch by the
# workflow's own token is allowed). The cron is only a fallback that restarts the chain if it ever breaks;
# concurrency keeps one run going and at most one waiting, so runs never pile up.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  actions: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Check the Pi every 2 minutes and publish to the status-data branch
        env:
          PI_URL: ${{ secrets.PI_URL || vars.PI_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          STATUS_FILE: ${{ github.workspace }}/data/status.json
        run: bash status/loop.sh
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run status.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
