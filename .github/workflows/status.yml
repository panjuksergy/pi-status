# Public status page: checks the Pi from GitHub (so it works while the Pi is down) and publishes status.json
# to the status-data branch; docs/index.html (GitHub Pages) reads it. See README.
name: status
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

permissions:
  contents: write
  issues: read

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    # Issue events only matter for incident issues (only collaborators can add that label), so strangers
    # opening issues can't trigger runs.
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'incident')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the Pi and write status.json
        env:
          PI_URL: ${{ vars.PI_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          STATUS_FILE: ${{ github.workspace }}/data/status.json
        run: |
          mkdir data
          git fetch origin status-data 2>/dev/null && git show FETCH_HEAD:status.json > data/status.json || true
          python3 status/update.py
      - name: Publish to the status-data branch (one commit, rewritten each time)
        working-directory: data
        run: |
          git init -q -b status-data
          git config user.name "status bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git commit -q -m "status $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-data
